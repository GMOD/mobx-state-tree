# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# filter_unconventional is false and the last commit_parsers entry is a
# catch-all `.*` group, so a commit that isn't in "type: subject" form still
# lands in the changelog (under "Other Changes") instead of silently
# vanishing — the release notes the publish workflow posts are read straight
# out of this file, so a dropped commit is a release that under-reports what
# changed.

[changelog]
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/GMOD/mobx-state-tree/compare/{% if previous %}{{ previous.version }}{% else %}{{ version }}{% endif %}...{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/GMOD/mobx-state-tree/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\
"""
trim = true
# Keep a header for every tag, even a release with nothing but skipped
# (e.g. dependency-bump) commits — matches every prior tag having an entry.
render_always = true

[git]
conventional_commits = true
# Do NOT drop commits that aren't conventional-format — route them to the
# catch-all group below instead. Plenty of this fork's history predates the
# convention, including every PR merged before v5.12.0.
filter_unconventional = false
require_conventional = false
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

commit_parsers = [
  { message = "^v?\\d+\\.\\d+\\.\\d+$", skip = true },
  { message = "^Merge", skip = true },
  { message = "^chore\\(deps", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance Improvements" },
  # This fork uses a `types:` prefix for changes that only move the public
  # .d.ts surface — the thing out-of-tree consumers actually compile against.
  { message = "^types", group = "Types" },
  { message = "^revert", group = "Reverts" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^style", group = "Styling" },
  { message = "^(chore|ci|build)", group = "Chores" },
  { message = ".*", group = "Other Changes" },
]
